id: 18054
name: dvc-api
environments:
    production:
        database: production
        memory: 1024
        cli-memory: 512
        runtime: 'php-8.5:al2023'
        domain: api.deltavcreative.com
        scheduler: false
        build:
            - 'composer install --no-dev'
            - 'php artisan event:cache'
            - 'php artisan filament:optimize'
            - 'npm ci && npm run build && rm -rf node_modules'
        deploy:
            - 'php artisan migrate --force'
